<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>撕袜大作战 · 肥鱼快跑</title>
<style>
  html, body { margin: 0; height: 100%; background: #05090d; color: #fff; font: 14px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif; overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: none; }
  body { display: grid; place-items: center; }
  /* 竖屏舞台：9:16，桌面上居中成一条 */
  #view { position: relative; height: 100vh; height: 100dvh; aspect-ratio: 9 / 16; max-width: 100vw; overflow: hidden; background: #0b1f2b; }
  @media (max-aspect-ratio: 9/16) { #view { width: 100vw; height: auto; max-height: 100dvh; } }
  #view canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .hidden { display: none !important; }
  #fx-lines { position: absolute; inset: -20%; pointer-events: none; opacity: 0; background: repeating-conic-gradient(from 0deg at 50% 42%, #fff0 0deg, #fff0 2.2deg, #ffffff30 2.6deg, #fff0 3deg); -webkit-mask-image: radial-gradient(circle at 50% 42%, #0000 30%, #000 75%); mask-image: radial-gradient(circle at 50% 42%, #0000 30%, #000 75%); }
  #vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, #0000 55%, #000a 115%); }
  #flash { position: absolute; inset: 0; pointer-events: none; background: #fff; opacity: 0; }

  #hud { position: absolute; left: 0; right: 0; top: 0; padding: 10px 12px 0; pointer-events: none; text-shadow: 0 1px 4px #000c; }
  #hud .top { display: flex; align-items: center; gap: 8px; }
  #lvname { flex: 1; font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #time { font: 800 26px/1 "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; }
  #time.low { color: #ff7a6b; }
  #gear { pointer-events: auto; width: 32px; height: 32px; border: 0; border-radius: 50%; background: #0008; color: #fff; font-size: 16px; }
  #prog { position: relative; height: 16px; margin-top: 8px; border-radius: 8px; background: #0008; }
  #prog .fill { height: 100%; width: 0; border-radius: 8px; background: linear-gradient(90deg, #ff9fc0, #ff4d86); }
  #prog .goal { position: absolute; top: -4px; bottom: -4px; width: 3px; background: #ffe27a; border-radius: 2px; }
  #prog .txt { position: absolute; inset: 0; text-align: center; font: 700 11px/16px "Segoe UI", sans-serif; }
  #power { position: relative; height: 9px; margin-top: 6px; border-radius: 5px; background: #0008; overflow: hidden; }
  #power i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #ffd25a, #ff8a3c); }
  #power b { position: absolute; left: 6px; top: -4px; font-size: 10px; }
  #power.full i { background: linear-gradient(90deg, #fff27a, #ff4d86); }
  #tug { position: absolute; left: 8%; right: 8%; bottom: 17%; pointer-events: none; text-shadow: 0 2px 6px #000d; }
  #tug .who { display: flex; justify-content: space-between; font-weight: 800; font-size: 14px; }
  #tug .bar { height: 22px; border-radius: 11px; background: #5aa0ffcc; border: 2px solid #fff; overflow: hidden; }
  #tug .bar i { display: block; height: 100%; margin-left: auto; width: 40%; background: linear-gradient(270deg, #ff4d86, #ffb0c8); }
  #tug .lab { margin-top: 8px; text-align: center; font: 900 22px/1 "Segoe UI", "Microsoft YaHei", sans-serif; color: #ffe27a; }
  #tug.hit .bar { animation: hit .12s; }
  @keyframes hit { 50% { transform: scale(1.04, 1.25); } }
  #meta { display: flex; justify-content: space-between; margin-top: 6px; font-size: 12px; font-weight: 600; }
  #combo { color: #ffe27a; }

  #bubble { position: absolute; padding: 5px 12px; border-radius: 14px; background: #fff; color: #33405a; font-weight: 700; font-size: 14px; transform: translate(-50%, -100%); opacity: 0; pointer-events: none; white-space: nowrap; box-shadow: 0 3px 10px #0005; }
  #pop { position: absolute; left: 50%; top: 40%; font: 900 34px/1 "Segoe UI", "Microsoft YaHei", sans-serif; color: #ffe27a; text-shadow: 0 3px 0 #b3486c, 0 6px 14px #000a; opacity: 0; pointer-events: none; white-space: nowrap; }
  #big { position: absolute; left: 0; right: 0; top: 30%; text-align: center; pointer-events: none; opacity: 0; }
  #big b { display: block; font: 900 58px/1.05 "Segoe UI", "Microsoft YaHei", sans-serif; letter-spacing: 4px; color: #fff; text-shadow: 0 4px 0 #ff4d86, 0 10px 26px #000c; }
  #big span { display: inline-block; margin-top: 10px; padding: 3px 14px; border-radius: 12px; background: #000a; font-size: 14px; font-weight: 600; }
  #tip { position: absolute; left: 0; right: 0; bottom: 26%; text-align: center; font-weight: 700; font-size: 15px; text-shadow: 0 2px 6px #000d; pointer-events: none; opacity: 0; }

  /* 底部操作区 */
  #pad { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 12px 14px; display: flex; align-items: flex-end; gap: 10px; }
  #stam { position: absolute; left: 12px; right: 12px; bottom: 96px; height: 7px; border-radius: 4px; background: #0008; overflow: hidden; }
  #stam i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #7fe0ff, #8dffb0); }
  #stam.low i { background: #ff7a6b; }
  .btn { flex: 1; height: 72px; border: 2px solid #ffffff40; border-radius: 18px; background: #0c1a24b8; color: #fff; font: 800 15px/1.2 "Segoe UI", "Microsoft YaHei", sans-serif; display: grid; place-items: center; touch-action: none; }
  .btn small { display: block; font-weight: 600; font-size: 10px; opacity: .7; }
  #bL { border-color: #3fd0ff88; } #bR { border-color: #ff5d8f88; }
  #bL.hot { border-color: #8fe6ff; background: #1fb4ecd0; box-shadow: 0 0 22px #3fd0ff; }
  #bR.hot { border-color: #ffa0bf; background: #ff4d86d0; box-shadow: 0 0 22px #ff5d8f; }
  .mark { position: absolute; width: 66px; height: 66px; margin: -33px 0 0 -33px; pointer-events: none; opacity: 0; display: grid; place-items: center; }
  .mark svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  .mark circle { fill: #0008; stroke: #ffffff30; stroke-width: 4; }
  .mark circle.arc { fill: none; stroke-width: 5; stroke-linecap: round; stroke-dasharray: 119.4; stroke-dashoffset: 119.4; }
  #mL circle.arc { stroke: #3fd0ff; } #mR circle.arc { stroke: #ff5d8f; }
  .mark b { position: relative; font: 900 24px/1 "Segoe UI", "Microsoft YaHei", sans-serif; text-shadow: 0 2px 4px #000c; }
  #mL.ready circle:first-child { fill: #1fb4ecd8; } #mR.ready circle:first-child { fill: #ff4d86d8; }
  .btn.down { transform: scale(.95); filter: brightness(1.4); }
  #bSprint { flex: 1.25; background: #123a4cc0; }
  #bSprint.down { background: #2aa7d8d0; border-color: #9fe6ff; }

  .overlay { position: absolute; inset: 0; display: grid; place-items: center; background: #06121ac8; }
  .card { width: 84%; padding: 22px 20px; border-radius: 18px; background: #18303ff2; box-shadow: 0 12px 40px #000a; text-align: center; }
  .card h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: 2px; }
  .card p { margin: 6px 0 12px; color: #b9d3e0; font-size: 13px; }
  .stars { font-size: 40px; letter-spacing: 6px; color: #ffe27a; }
  .stars i { font-style: normal; opacity: .22; }
  .go { margin-top: 10px; width: 100%; padding: 13px; border: 0; border-radius: 12px; background: linear-gradient(90deg, #ff9fc0, #ff4d86); color: #fff; font: 800 17px/1 inherit; letter-spacing: 3px; }
  .go.ghost { background: #ffffff18; font-size: 13px; letter-spacing: 1px; }
  .lv { display: flex; align-items: center; gap: 8px; width: 100%; margin: 6px 0; padding: 9px 12px; border: 1px solid #ffffff22; border-radius: 10px; background: #ffffff10; color: #fff; font: inherit; text-align: left; }
  .lv b { flex: 1; } .lv small { color: #9fc3d6; } .lv.lock { opacity: .4; } .lv.cur { border-color: #ff4d86; background: #ff4d8630; }
  .row { display: flex; gap: 8px; margin-top: 10px; } .row .go { margin-top: 0; }
  small.credit { display: block; margin-top: 12px; color: #6f8d9c; font-size: 10px; line-height: 1.4; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; background: #0b1f2b; color: #9fc3d6; font-size: 15px; }
</style>
</head>
<body>
<div id="view">
  <div id="fx-lines"></div><div id="vignette"></div><div id="flash"></div>
  <div id="hud" class="hidden">
    <div class="top"><div id="lvname"></div><div id="time">45.0</div><button id="gear" title="暂停">⏸</button></div>
    <div id="prog"><div class="fill"></div><div class="goal"></div><div class="txt"></div></div>
    <div id="power"><i></i><b>气力</b></div>
    <div id="meta"><span id="gap"></span><span id="combo"></span></div>
  </div>
  <div id="bubble"></div><div id="pop"></div>
  <div id="big"><b></b><span></span></div>
  <div id="tip"></div>
  <div class="mark" id="mL"><svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="19"/><circle class="arc" cx="22" cy="22" r="19"/></svg><b>左</b></div>
  <div class="mark" id="mR"><svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="19"/><circle class="arc" cx="22" cy="22" r="19"/></svg><b>右</b></div>
  <div id="tug" class="hidden"><div class="who"><span>她</span><span>你</span></div><div class="bar"><i></i></div><div class="lab">狂点屏幕！别停！</div></div>
  <div id="stam" class="hidden"><i></i></div>
  <div id="pad" class="hidden">
    <div class="btn" id="bL">左手<small>A / ←</small></div>
    <div class="btn" id="bSprint">冲 刺<small>空格 按住</small></div>
    <div class="btn" id="bR">右手<small>D / →</small></div>
  </div>

  <div id="result" class="overlay hidden"><div class="card">
    <h1 id="resTitle"></h1><div class="stars" id="resStars"></div><p id="resText"></p>
    <button class="go" id="resNext"></button>
    <div class="row"><button class="go ghost" id="resRetry">再来一次</button><button class="go ghost" id="resMenu">选关</button></div>
  </div></div>
  <div id="menu" class="overlay hidden"><div class="card">
    <h1>撕袜大作战</h1>
    <p>按住<b>冲刺</b>追上去，松开后看准她<b>后甩的那条腿</b>，用对应的手拽住、撕破。</p>
    <div id="levels"></div>
    <div class="row"><button class="go ghost" id="optSfx"></button><button class="go ghost" id="optShake"></button></div>
    <button class="go" id="resume">继 续</button>
    <small class="credit">肥鱼：DeepSeek-chan（溟月 by 上善无形 / 女仆版 by ZipZipPipe / 模型 by ニケ，CC BY-NC-SA 4.0）<br>糙汉：Microsoft Rocketbox · Construction_Male_04（MIT）</small>
  </div></div>
  <div id="loading">正在加载肥鱼和糙汉…</div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
